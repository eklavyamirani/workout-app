name: Build preview images

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run frontend build
        run: npm run build 2>&1 | tee frontend-build.log

      - name: Run frontend and E2E tests
        run: npm run test:e2e 2>&1 | tee frontend-e2e.log

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      - name: Run API tests
        run: dotnet test ./api/WorkoutApp.sln --configuration Release --nologo 2>&1 | tee api-tests.log

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build frontend OCI layout
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deploy/frontend.Dockerfile \
            --output type=oci,dest=frontend.oci.tar \
            --label org.opencontainers.image.source=https://github.com/${REPOSITORY} \
            --label org.opencontainers.image.revision=${HEAD_SHA} \
            --label org.opencontainers.image.version=pr-${PR_NUMBER}-${HEAD_SHA} \
            --label org.opencontainers.image.title=workout-app-frontend \
            .

      - name: Build API OCI layout
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deploy/api.Dockerfile \
            --output type=oci,dest=api.oci.tar \
            --label org.opencontainers.image.source=https://github.com/${REPOSITORY} \
            --label org.opencontainers.image.revision=${HEAD_SHA} \
            --label org.opencontainers.image.version=pr-${PR_NUMBER}-${HEAD_SHA} \
            --label org.opencontainers.image.title=workout-app-api \
            .

      - name: Write metadata
        if: always()
        run: |
          mkdir -p metadata diagnostics
          cat > metadata/frontend.json <<META
          {
            "repository": "${REPOSITORY}",
            "pr_number": ${PR_NUMBER},
            "head_sha": "${HEAD_SHA}",
            "component": "frontend",
            "oci_labels": {
              "org.opencontainers.image.source": "https://github.com/${REPOSITORY}",
              "org.opencontainers.image.revision": "${HEAD_SHA}",
              "org.opencontainers.image.version": "pr-${PR_NUMBER}-${HEAD_SHA}",
              "org.opencontainers.image.title": "workout-app-frontend"
            },
            "build_result": "${{ job.status }}"
          }
          META
          cat > metadata/api.json <<META
          {
            "repository": "${REPOSITORY}",
            "pr_number": ${PR_NUMBER},
            "head_sha": "${HEAD_SHA}",
            "component": "api",
            "oci_labels": {
              "org.opencontainers.image.source": "https://github.com/${REPOSITORY}",
              "org.opencontainers.image.revision": "${HEAD_SHA}",
              "org.opencontainers.image.version": "pr-${PR_NUMBER}-${HEAD_SHA}",
              "org.opencontainers.image.title": "workout-app-api"
            },
            "build_result": "${{ job.status }}"
          }
          META
          mv *.log diagnostics/ 2>/dev/null || true

      - name: Upload OCI artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-oci-layouts
          path: |
            frontend.oci.tar
            api.oci.tar
          retention-days: 7
          if-no-files-found: error

      - name: Upload metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-build-metadata
          path: metadata/
          retention-days: 14
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-build-diagnostics
          path: diagnostics/
          retention-days: 14
          if-no-files-found: warn

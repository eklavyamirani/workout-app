# Platform v2 (eklavyamirani/app-platform, records 0035, 0052): build workout's
# images, push them to GitHub's container registry (ghcr.io/<owner>/<image>,
# tagged by commit SHA) and attest how they were built. This workflow has no
# Azure or cluster access, and needs no repository variables or secrets: it
# uses only this repository's own GITHUB_TOKEN. The cluster runs an image
# only after the owner pins its digest (scripts/promote for main,
# scripts/preview for a pull request), which first checks the attestation:
# main's images must come from a main-branch run of this repository. A
# pull request's images run nowhere unless the owner approves that PR.
# Generated by scripts/new-app.
name: Platform v2 images

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: platform-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # Pull requests from forks get no write token: no images for them.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # this repository's packages on ghcr.io
      id-token: write       # signs the attestations (Sigstore); no cloud login
      attestations: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGES: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: workout-web image
        id: workout_web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGES }}/workout-web:${{ env.SHA }}
          # Links the package to this repository, so it is public like the repository.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: workout-web provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGES }}/workout-web
          subject-digest: ${{ steps.workout_web.outputs.digest }}
          push-to-registry: true
      - name: workout-api image
        id: workout_api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGES }}/workout-api:${{ env.SHA }}
          # Links the package to this repository, so it is public like the repository.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: workout-api provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGES }}/workout-api
          subject-digest: ${{ steps.workout_api.outputs.digest }}
          push-to-registry: true
      - name: workout-db image
        id: workout_db
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: db
          file: db/Dockerfile
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGES }}/workout-db:${{ env.SHA }}
          # Links the package to this repository, so it is public like the repository.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: workout-db provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGES }}/workout-db
          subject-digest: ${{ steps.workout_db.outputs.digest }}
          push-to-registry: true

name: Publish release images

# Trusted release publisher. Only strict semantic version tags (vMAJOR.MINOR.PATCH) are
# accepted; `latest` and mutable branch or preview tags are never published.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_SOURCE: https://github.com/eklavyamirani/workout-app
  FRONTEND_SUBJECT: ghcr.io/eklavyamirani/workout-app/frontend
  API_SUBJECT: ghcr.io/eklavyamirani/workout-app/api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish: '$REF_NAME' is not a strict vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to publish: invalid commit SHA" >&2
            exit 1
          fi
          {
            echo "version=$REF_NAME"
            echo "revision=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Run API tests
        run: dotnet test server/server.Tests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push frontend
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --file deploy/Dockerfile \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --label "org.opencontainers.image.title=workout-app-frontend" \
            --tag "${FRONTEND_SUBJECT}:${{ steps.meta.outputs.version }}" \
            --metadata-file frontend-metadata.json \
            --push \
            .

      - name: Build and push API
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --file server/Dockerfile \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --label "org.opencontainers.image.title=workout-app-api" \
            --tag "${API_SUBJECT}:${{ steps.meta.outputs.version }}" \
            --metadata-file api-metadata.json \
            --push \
            server

      - name: Collect published digests
        id: digests
        run: |
          set -euo pipefail
          frontend_digest="$(jq -r '."containerimage.digest"' frontend-metadata.json)"
          api_digest="$(jq -r '."containerimage.digest"' api-metadata.json)"
          for d in "$frontend_digest" "$api_digest"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest: $d" >&2; exit 1; }
          done
          echo "frontend=$frontend_digest" >> "$GITHUB_OUTPUT"
          echo "api=$api_digest" >> "$GITHUB_OUTPUT"

      - name: Verify published platforms
        run: |
          set -euo pipefail
          for pair in "${FRONTEND_SUBJECT}@${{ steps.digests.outputs.frontend }}" "${API_SUBJECT}@${{ steps.digests.outputs.api }}"; do
            docker buildx imagetools inspect --raw "$pair" | jq -e '
              (.manifests | length) == 2 and
              ([.manifests[] | ((.platform.os // "") + "/" + (.platform.architecture // ""))] | sort == ["linux/amd64", "linux/arm64"])
            ' > /dev/null
          done

      # `docker sbom` is a Docker Desktop CLI plugin and does not exist on GitHub-hosted
      # runners, so SBOM generation is done with a pinned syft release whose archive is
      # checksum-verified before use.
      - name: Install syft
        env:
          SYFT_VERSION: 1.49.0
          SYFT_SHA256: 7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft version

      - name: Generate SPDX SBOMs
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          mkdir -p sbom
          docker pull --platform linux/amd64 "${FRONTEND_SUBJECT}@${{ steps.digests.outputs.frontend }}"
          docker pull --platform linux/amd64 "${API_SUBJECT}@${{ steps.digests.outputs.api }}"
          syft scan -o spdx-json "docker:${FRONTEND_SUBJECT}@${{ steps.digests.outputs.frontend }}" > sbom/frontend.spdx.json
          syft scan -o spdx-json "docker:${API_SUBJECT}@${{ steps.digests.outputs.api }}" > sbom/api.spdx.json
          jq -e '.spdxVersion and (.packages | length > 0)' sbom/frontend.spdx.json > /dev/null
          jq -e '.spdxVersion and (.packages | length > 0)' sbom/api.spdx.json > /dev/null

      - name: Attest frontend provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/frontend
          subject-digest: ${{ steps.digests.outputs.frontend }}
          push-to-registry: true

      - name: Attest API provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/api
          subject-digest: ${{ steps.digests.outputs.api }}
          push-to-registry: true

      - name: Attest frontend SPDX SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/frontend
          subject-digest: ${{ steps.digests.outputs.frontend }}
          sbom-path: sbom/frontend.spdx.json
          push-to-registry: true

      - name: Attest API SPDX SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/api
          subject-digest: ${{ steps.digests.outputs.api }}
          sbom-path: sbom/api.spdx.json
          push-to-registry: true

      - name: Summarize release
        run: |
          {
            echo "### Published release images"
            echo ""
            echo "| Image | Tag | Digest |"
            echo "| --- | --- | --- |"
            echo "| frontend | ${{ steps.meta.outputs.version }} | ${{ steps.digests.outputs.frontend }} |"
            echo "| api | ${{ steps.meta.outputs.version }} | ${{ steps.digests.outputs.api }} |"
          } >> "$GITHUB_STEP_SUMMARY"

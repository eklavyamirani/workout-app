name: Publish release images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - run: dotnet test ./api/WorkoutApp.sln --configuration Release --nologo

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/eklavyamirani/workout-app/frontend:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=workout-app-frontend

      - name: Build and push API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/eklavyamirani/workout-app/api:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=workout-app-api

      - name: Attest frontend provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Attest API provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Generate release SBOM files
        id: sbom
        continue-on-error: true
        run: |
          set -euo pipefail
          docker pull ghcr.io/eklavyamirani/workout-app/frontend:${GITHUB_REF_NAME}
          docker pull ghcr.io/eklavyamirani/workout-app/api:${GITHUB_REF_NAME}
          docker sbom --format spdx-json ghcr.io/eklavyamirani/workout-app/frontend:${GITHUB_REF_NAME} > frontend.spdx.json
          docker sbom --format spdx-json ghcr.io/eklavyamirani/workout-app/api:${GITHUB_REF_NAME} > api.spdx.json

      - name: Attest frontend SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          sbom-path: frontend.spdx.json
          push-to-registry: true

      - name: Attest API SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-name: ghcr.io/eklavyamirani/workout-app/api
          subject-digest: ${{ steps.api.outputs.digest }}
          sbom-path: api.spdx.json
          push-to-registry: true

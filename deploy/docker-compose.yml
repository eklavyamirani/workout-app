services:
  # --- Reverse proxy ---
  traefik:
    image: traefik:v3.3
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      workout-app:
        condition: service_healthy
      api:
        condition: service_healthy

  # --- Frontend ---
  workout-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: workout-app-frontend:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    volumes:
      # Non-secret, per-deployment configuration. The image itself is environment-agnostic.
      - ./runtime-config.json:/usr/share/nginx/html/runtime-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4173/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=false

  # --- API ---
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: workout-app-api:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/tmp:rw,noexec,nosuid,size=32m
    environment:
      # Connection information never contains the password; it is read from a mounted file.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=workout;Username=workout_app"
      ConnectionStrings__Default__PasswordFile: /run/secrets/app-role-password
      # Schema/role bootstrap runs with an administrative connection; the runtime
      # connection above is a non-superuser role so RLS is enforced.
      ConnectionStrings__Admin: "Host=db;Port=5432;Database=workout;Username=workout"
      ConnectionStrings__Admin__PasswordFile: /run/secrets/postgres-password
      Database__AppRolePasswordFile: /run/secrets/app-role-password
      Auth__Issuer: "http://localhost/application/o/workout-app/"
      Auth__MetadataAddress: "http://authentik-server:9000/application/o/workout-app/.well-known/openid-configuration"
      Auth__ClientId: "workout-app"
    secrets:
      - postgres-password
      - app-role-password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The API image intentionally ships no curl/wget; use bash's /dev/tcp instead.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"healthy\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=false

  # --- App database ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workout
      POSTGRES_USER: workout
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Identity provider ---
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.2
    command: server
    restart: unless-stopped
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY-change-me-in-production}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD-authentik}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD-admin}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL-admin@localhost}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN-test-admin-token}
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.2
    command: worker
    restart: unless-stopped
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY-change-me-in-production}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD-authentik}
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_started

  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD-authentik}
    volumes:
      - authentik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - authentik-redis:/data

secrets:
  postgres-password:
    file: ./secrets/postgres-password
  app-role-password:
    file: ./secrets/app-role-password

volumes:
  pgdata:
  authentik-pgdata:
  authentik-redis:
